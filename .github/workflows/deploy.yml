name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate confirmed Mission 3 coach
        run: node scripts/validate-coach.mjs
      - name: Build and validate Mission 2 studio
        run: |
          npx --yes pnpm@11.25.0 --dir mission-2-studio install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@11.25.0 --dir mission-2-studio build
          node mission-2-studio/validate-glb.mjs mission-2-studio/public/confirmed/model.glb
          mkdir -p public/venture-studio
          cp -R mission-2-studio/dist/. public/venture-studio/
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
